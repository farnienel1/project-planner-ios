<header class="top"><h1>Project Planner: Add New User UI</h1>
<p>A visual reference for the iOS UI-only upgrade. Values shown are sample data taken from the current app. Read it alongside <code>add-user-ui-spec.md</code>, which lists every data field and where it now lives.</p></header>

<div class="pp-navy" style="width: 390px; height: 844px; display: flex; flex-direction: column; font-family: 'Inter', sans-serif; color: #0F1B33; overflow: hidden; font-variant-numeric: tabular-nums">
  <header style="padding: 54px 16px 0; display: flex; flex-direction: column; gap: 16px; color: #FFFFFF">

  </header>

  <div style="flex-grow: 1; margin-top: 18px; background: #F2F4F8; border-radius: 28px 28px 0 0; padding: 20px 16px 0; display: flex; flex-direction: column; gap: 12px; min-height: 0">

    </div>

    <div role="radiogroup" aria-label="Account type" style="display: flex; flex-direction: column; gap: 10px">
      
        <button role="radio" aria-checked="false" style="display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 18px; background: #FFFFFF; font: inherit; cursor: pointer; border: 1px solid #E3E8F0; margin: 1px;">
          <span style="width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(160deg, #5B8CF0, #2F5FD0); color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"></path></svg></span>
          <span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; text-align: left">

          </span>

        </button>
      
        <button role="radio" aria-checked="true" style="display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 18px; background: #FFFFFF; font: inherit; cursor: pointer; border: 2px solid #2F6FE0; box-shadow: 0 6px 16px rgba(47,111,224,0.14);">
          <span style="width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(160deg, #8B7CF6, #5B46D6); color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18v13H3zM9 7V4h6v3M3 12h18"></path></svg></span>
          <span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; text-align: left">
            <span style="font-size: 16px; font-weight: 600; color: #0F1B33">Manager</span>
            <span style="font-size: 12.5px; line-height: 1.4; color: #64748B">Manage teams, schedules and optional modules.</span>
          </span>
          <span style="width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; box-sizing: border-box; background: #2F6FE0;"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
        </button>
      
        <button role="radio" aria-checked="false" style="display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 18px; background: #FFFFFF; font: inherit; cursor: pointer; border: 1px solid #E3E8F0; margin: 1px;">
          <span style="width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(160deg, #FBBF4A, #E08A0B); color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17h18M5 17v-2a7 7 0 0 1 14 0v2M10 9V6h4v3"></path></svg></span>
          <span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; text-align: left">
            <span style="font-size: 16px; font-weight: 600; color: #0F1B33">Operative</span>
            <span style="font-size: 12.5px; line-height: 1.4; color: #64748B">Schedule, annual leave and qualifications.</span>
          </span>
          <span style="width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; box-sizing: border-box; border: 2px solid #C5CDD9;"></span>
        </button>
      
    </div>

    <div style="flex-grow: 1"></div>
    <div style="margin: 0 -16px; background: #FFFFFF; border-top: 1px solid #E3E8F0; padding: 12px 16px 30px; display: flex; gap: 10px">
      <button disabled style="width: 96px; height: 52px; border-radius: 16px; background: #F2F4F8; color: #94A3B8; border: 0; font: inherit; font-size: 15.5px; font-weight: 600">Back</button>
      <button style="flex-grow: 1; height: 52px; border-radius: 16px; background: linear-gradient(180deg, #3B7BF0, #2559D6); color: #FFFFFF; border: 0; font: inherit; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; box-shadow: 0 4px 12px rgba(37,89,214,0.30)">Next: details<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
    </div>
  </div>
</div>
</div></figure>
<figure class="screen"><figcaption><b>Step 2 · User details (line manager missing)</b><span>Fields are grouped into About you, Employment and Line manager(s). This shows the validation state: the original red message sits inline next to the problem, and the button says what is missing.</span></figcaption><div class="phone">
<div class="pp-navy" style="width: 390px; height: 1540px; display: flex; flex-direction: column; font-family: 'Inter', sans-serif; color: #0F1B33; overflow: hidden; font-variant-numeric: tabular-nums">
  <header style="padding: 54px 16px 0; display: flex; flex-direction: column; gap: 16px; color: #FFFFFF">

        </span>
      </div>
    </div>
    <ol style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
      
        <li style="display: flex; flex-direction: column; gap: 6px"><span style="height: 4px; border-radius: 2px; background: #3B7BF0;"></span><span style="font-size: 12px; color: #C7D0E1;">✓ Type</span></li>

        <li style="display: flex; flex-direction: column; gap: 6px"><span style="height: 4px; border-radius: 2px; background: rgba(255,255,255,0.14);"></span><span style="font-size: 12px; color: #93A1BC;">4 · Review</span></li>
      
    </ol>
  </header>

  <div style="flex-grow: 1; margin-top: 18px; background: #F2F4F8; border-radius: 28px 28px 0 0; padding: 20px 16px 0; display: flex; flex-direction: column; gap: 12px; min-height: 0">

          <input value="Taylor" aria-label="Surname" style="border: 0; outline: 0; padding: 0; background: transparent; font: inherit; font-size: 16px; color: #0F1B33">
        </label>
      
        <label style="display: flex; flex-direction: column; gap: 3px; padding: 11px 14px; border-bottom: 1px solid #EEF1F6;">

    <h3 style="margin: 6px 4px 0; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: #64748B">EMPLOYMENT</h3>

      <button style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; background: #F6F8FC; border: 1px solid #E3E8F0; font: inherit; color: #0F1B33; text-align: left; cursor: pointer">

        <span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 12px; color: #64748B">Trade type *</span><span style="font-size: 15.5px; font-weight: 600">Electrician</span></span>
