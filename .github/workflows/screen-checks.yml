name: Screen checks

# Launches the app in an iPhone simulator on seeded TEST data (no Firebase) and runs the release screen checks
# (ProjectPlannerUITests/Release1320ScreenChecksTests: test session Part A) and the Add New User screen checks
# (AddUserScreenChecksTests, docs/design/add-user-ui). iPhone 16e runs both; iPhone SE (3rd generation) and the newest
# Pro Max run the Add User checks only. A missing SE or Pro Max simulator is created with simctl when the runner has
# the device type; otherwise that leg says so and stops. Screenshots are uploaded as one "screen-checks-<device>"
# artifact per device, so the screens can be reviewed without opening Xcode.
#
# When it runs (owner, 24 Nov: cut the load on the Macs; parity-tests in the Rulebook workflow still runs on every PR):
# - a PR that has the `screen-checks` label (adding the label starts it);
# - a PR whose changes touch the screens (UI_PATHS below);
# - every push to main;
# - by hand (Actions > Screen checks > Run workflow), or called from a release workflow (workflow_call).
# A cheap Linux job decides; the three Mac legs start only when it says so. Screen checks are not a required check
# on main (the "Protect Main" ruleset requires parity-tests, mirror-intact and gitleaks only), so a PR where they
# do not run can still be merged.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - name: Should the screen checks run?
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ADDED_LABEL: ${{ github.event.label.name }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'screen-checks') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Files that change what a screen shows. Anything else (rules, models, stores) can be covered by adding
          # the screen-checks label, and every push to main runs the checks anyway.
          UI_PATHS='^(Project Planner/(Views|PPDesign|Navigation|Assets\.xcassets|Resources)/|Project Planner/[^/]*View\.swift$|Project Planner/(UITestingMode|Theme|AppBranding)\.swift$|ProjectPlannerUITests/|\.github/workflows/screen-checks\.yml$|scripts/ci-xcode-summary\.mjs$)'
          run=false; why=""
          if [ "$EVENT" != "pull_request" ]; then
            run=true; why="$EVENT"
          else
            ui=false
            if git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -Eq "$UI_PATHS"; then ui=true; fi
            if [ "$ACTION" = "labeled" ]; then
              # Adding the label starts a run, unless the screens changed: then this commit already has a run
              # (from opened / synchronize), and a second one would only repeat it. Other labels do nothing.
              if [ "$ADDED_LABEL" = "screen-checks" ] && [ "$ui" = false ]; then run=true; why="screen-checks label added"; fi
            elif [ "$HAS_LABEL" = "true" ]; then run=true; why="screen-checks label"
            elif [ "$ui" = true ]; then run=true; why="screen files changed"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" = true ]; then
            echo "Screen checks will run ($why)." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Screen checks skipped: no screen files changed and no screen-checks label (add the label to run them)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  screen-checks:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: macos-26
    # A leg takes 30-45 minutes. The test step stops at 60 so the screenshots, log and summary still upload
    # inside the job's 75. (Time waiting in the queue for a Mac is not counted.)
    timeout-minutes: 75
    # A newer push to the same PR cancels this PR's older legs (one group per PR and device); runs on other
    # branches, on main and by hand are never cancelled. Label events that do not start a run never reach here.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('screen-checks-pr-{0}-{1}', github.event.pull_request.number, matrix.slug) || format('screen-checks-{0}-{1}', github.run_id, matrix.slug) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: iphone-16e
            device: iPhone 16e
            only: -only-testing:ProjectPlannerUITests/VariationsTests
          - slug: iphone-se
            device: iPhone SE (3rd generation)
            only: -only-testing:ProjectPlannerUITests/AddUserScreenChecksTests
          - slug: iphone-pro-max
            device: Pro Max
            only: -only-testing:ProjectPlannerUITests/AddUserScreenChecksTests
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$xcode" ]; then echo "::error::No Xcode 26 on this runner image"; ls -d /Applications/Xcode*.app; exit 1; fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
      - name: Restore Swift packages
        # Package checkouts only (never DerivedData); see rulebook.yml.
        uses: actions/cache@v4
        with:
          path: ~/spm-source-packages
          key: spm-${{ runner.os }}-${{ hashFiles('**/project.pbxproj') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Run the screen checks
        id: tests
        timeout-minutes: 60
        env:
          DEVICE: ${{ matrix.device }}
          ONLY: ${{ matrix.only }}
        run: |
          # Pick the simulator for this leg: an exact name, or (for "Pro Max") the newest iPhone whose name ends so.
          sim=$(xcrun simctl list devices available -j | WANT="$DEVICE" node -e '
            const d=JSON.parse(require("fs").readFileSync(0,"utf8")).devices; const want=process.env.WANT;
            const ios=Object.keys(d).filter(k=>k.includes("iOS")).sort().reverse();
            const match=(x)=> want==="Pro Max" ? /^iPhone \d+ Pro Max$/.test(x.name) : x.name===want;
            let found=null;
            for (const k of ios) { const p=d[k].filter(match).sort((a,b)=>b.name.localeCompare(a.name,undefined,{numeric:true}))[0]; if (p) { found=p; break; } }
            // iPhone 16e keeps the old fallback (any iPhone), as before this matrix.
            if (!found && want==="iPhone 16e") for (const k of ios) { const p=d[k].find(x=>x.name.startsWith("iPhone")); if (p) { found=p; break; } }
            if (found) console.log(found.udid);')
          if [ -z "$sim" ] && [ "$DEVICE" != "Pro Max" ]; then
            # Not preinstalled: create it on the newest iOS runtime that offers this device type.
            type_id=$(xcrun simctl list devicetypes -j | WANT="$DEVICE" node -e '
              const t=JSON.parse(require("fs").readFileSync(0,"utf8")).devicetypes.find(x=>x.name===process.env.WANT);
              if (t) console.log(t.identifier)')
            runtime=$(xcrun simctl list runtimes -j | TYPE="$type_id" node -e '
              const r=JSON.parse(require("fs").readFileSync(0,"utf8")).runtimes
                .filter(x=>x.isAvailable && x.platform==="iOS" && (x.supportedDeviceTypes||[]).some(t=>t.identifier===process.env.TYPE))
                .sort((a,b)=>b.version.localeCompare(a.version,undefined,{numeric:true}));
              if (r[0]) console.log(r[0].identifier)')
            if [ -n "$type_id" ] && [ -n "$runtime" ]; then
              sim=$(xcrun simctl create "$DEVICE" "$type_id" "$runtime")
              echo "Created $DEVICE ($runtime)"
            fi
          fi
          if [ -z "$sim" ]; then
            echo "::warning::No '$DEVICE' simulator on this runner and none could be created; this leg did not run."
            echo "## Screen checks ($DEVICE)" >> "$GITHUB_STEP_SUMMARY"
            echo "Not run: no '$DEVICE' simulator on this runner image." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Simulator: $sim ($DEVICE)"
          # Boot the simulator and wait until it has finished booting before the tests start. Without this the first
          # test of a leg pays for the cold boot inside app.launch() and can fail with "Timed out while requesting
          # launch progress" (Pro Max AU01, run 42308162643) although the app and the test are fine.
          xcrun simctl boot "$sim" 2>/dev/null || true
          xcrun simctl bootstatus "$sim" -b || echo "::warning::simctl bootstatus did not confirm the boot; continuing"
          set +e
          xcodebuild test \
            -project "Project Planner.xcodeproj" \
            -scheme "Project Planner" \
            -testPlan ProjectPlanner-Full \
            -destination "platform=iOS Simulator,id=$sim" \
            $ONLY \
            -parallel-testing-enabled NO \
            -clonedSourcePackagesDirPath "$HOME/spm-source-packages" \
            -resultBundlePath ScreenChecks.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Results (pass / fail and why, compile errors)
        if: always()
        env:
          DEVICE: ${{ matrix.device }}
          STATUS: ${{ steps.tests.outputs.status || steps.tests.outcome }}
        run: |
          if [ -d ScreenChecks.xcresult ]; then
            xcrun xcresulttool get test-results tests --path ScreenChecks.xcresult > results.json 2>/dev/null || rm -f results.json
          fi
          node scripts/ci-xcode-summary.mjs --title "Screen checks ($DEVICE)" --log xcodebuild.log --results results.json --status "$STATUS" --all
      - name: Export screenshots and zip the result bundle
        if: always()
        run: |
          mkdir -p screenshots
          if [ -d ScreenChecks.xcresult ]; then
            xcrun xcresulttool export attachments --path ScreenChecks.xcresult --output-path screenshots > /dev/null || true
            ditto -c -k --keepParent ScreenChecks.xcresult ScreenChecks.xcresult.zip || true
          fi
          echo "$(ls screenshots | wc -l) files exported"
      - name: Upload screenshots, log and result bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screen-checks-${{ matrix.slug }}
          path: |
            screenshots
            xcodebuild.log
            results.json
            ScreenChecks.xcresult.zip
          if-no-files-found: warn
          retention-days: 7
