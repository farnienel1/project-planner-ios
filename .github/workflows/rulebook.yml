name: Rulebook

# iOS half of the one-rulebook check. docs/RULEBOOK.md and Project Planner/Canonical/* are mirrors of
# project-planner-web (scripts/sync-rulebook-from-web.sh). This fails when the mirror was edited by hand,
# when the parity tests fail, and (daily) when web has published a different pack than iOS runs.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:
    inputs:
      web_branch:
        description: Web branch whose published manifest iOS must match
        default: main

permissions:
  contents: read

# A new push to a PR cancels that PR's older run (its parity-tests would be superseded anyway). Only pull_request
# runs share a group, one per PR number; pushes to main, the daily schedule and manual runs each get their own
# group (run id), so nothing on another branch, and nothing on main, is ever cancelled. pull_request runs here only
# on opened / synchronize / reopened (the default types), so a label or a base-branch edit starts no run and
# cancels nothing.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('rulebook-pr-{0}', github.event.pull_request.number) || format('rulebook-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mirror-intact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirrored pack matches its manifest
        run: echo '{}' | bash scripts/rulebook-guard.sh stop

  web-drift:
    # Same drift alarm web runs: red while iOS lags the rulebook web published.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: iOS runs the pack web published
        env:
          WEB_BRANCH: ${{ inputs.web_branch || 'main' }}
        run: |
          url="https://raw.githubusercontent.com/farnienel1/project-planner-web/$WEB_BRANCH/lib/canonical/dist/canonical-manifest.json"
          if ! curl -fsSL "$url" -o web-manifest.json; then
            echo "::warning::Web $WEB_BRANCH has no published canonical-manifest.json yet ($url)."
            exit 0
          fi
          web=$(node -p "require('./web-manifest.json').bundleSha256")
          webVersion=$(node -p "require('./web-manifest.json').rulebookVersion")
          ios=$(node -p "require('./Project Planner/Canonical/canonical-manifest.json').bundleSha256")
          iosVersion=$(node -p "require('./Project Planner/Canonical/canonical-manifest.json').rulebookVersion")
          if [ "$ios" != "$web" ]; then
            echo "::error::iOS runs rulebook $iosVersion ($ios); web $WEB_BRANCH publishes $webVersion ($web). Run scripts/sync-rulebook-from-web.sh and follow web docs/ios-handoff/LATEST.md."
            exit 1
          fi
          echo "iOS mirrors rulebook $iosVersion."

  parity-tests:
    if: github.event_name != 'schedule'
    # The project is Xcode 26.2 (LastUpgradeCheck 2620): iOS 26 SDK APIs and Swift 6.2 default MainActor isolation.
    runs-on: macos-26
    # A real run takes 15-20 minutes. The test step stops at 35 so the log, result bundle and summary steps
    # still run inside the job's 45; a hang now fails with a log instead of sitting until GitHub's 6-hour limit.
    # (Time waiting in the queue for a Mac is not counted by either limit.)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$xcode" ]; then echo "::error::No Xcode 26 on this runner image"; ls -d /Applications/Xcode*.app; exit 1; fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
      - name: Restore Swift packages
        # Only the package checkouts (Firebase, snapshot-testing) are cached, never DerivedData. The project has no
        # committed Package.resolved, so the key is the project file (which holds the version rules); xcodebuild
        # still resolves on every run and updates a stale checkout, so a wrong cache only costs time.
        uses: actions/cache@v4
        with:
          path: ~/spm-source-packages
          key: spm-${{ runner.os }}-${{ hashFiles('**/project.pbxproj') }}
          restore-keys: spm-${{ runner.os }}-
      - name: ProjectPlannerTests (unit tests; snapshot tests are pinned to iPhone 16e / iOS 26.2 and skipped here)
        id: tests
        timeout-minutes: 35
        run: |
          sim=$(xcrun simctl list devices available -j | node -e '
            const d=JSON.parse(require("fs").readFileSync(0,"utf8")).devices;
            const ios=Object.keys(d).filter(k=>k.includes("iOS")).sort().reverse();
            for (const k of ios) { const p=d[k].find(x=>x.name.startsWith("iPhone")); if (p) { console.log(p.udid); break; } }')
          echo "Simulator: $sim"
          set +e
          xcodebuild test \
            -project "Project Planner.xcodeproj" \
            -scheme ProjectPlannerTests \
            -destination "platform=iOS Simulator,id=$sim" \
            -only-testing:ProjectPlannerTests \
            -skip-testing:ProjectPlannerTests/FixedSampleScreenSnapshotTests \
            -clonedSourcePackagesDirPath "$HOME/spm-source-packages" \
            -resultBundlePath ParityTests.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"
      - name: Summary (compile errors and failing tests)
        if: always()
        env:
          STATUS: ${{ steps.tests.outputs.status || steps.tests.outcome }}
        run: |
          if [ -d ParityTests.xcresult ]; then
            xcrun xcresulttool get test-results tests --path ParityTests.xcresult > results.json 2>/dev/null || rm -f results.json
          fi
          node scripts/ci-xcode-summary.mjs --title "Parity tests (ProjectPlannerTests)" --log xcodebuild.log --results results.json --status "$STATUS"
      - name: Zip the result bundle
        if: always()
        run: |
          if [ -d ParityTests.xcresult ]; then ditto -c -k --keepParent ParityTests.xcresult ParityTests.xcresult.zip; fi
      - name: Upload log and result bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parity-tests-logs
          path: |
            xcodebuild.log
            results.json
            ParityTests.xcresult.zip
          if-no-files-found: warn
          retention-days: 7
